name: CI

on:
  push:
    branches: [main, 'rc/**']
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  python:
    name: Python helper packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e tools/reverse-lab -e "bindings/python[numpy,pandas]" pytest
      - name: Test
        run: python -m pytest tools/reverse-lab/tests bindings/python/tests tests/release

  python-wheel-macos:
    name: Python wheel (macOS arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel
      # Same command as the release workflow: build the abi3 wheel, repair it
      # with delocate and run the binding tests against the installed wheel.
      - name: Build and test wheels
        run: python -m cibuildwheel --output-dir wheelhouse bindings/python
      - name: Check the wheel is self-contained and reads a fixture
        run: |
          set -euo pipefail
          ls -l wheelhouse
          wheel=$(ls wheelhouse/nirs4all_formats-*-cp310-abi3-macosx_11_0_arm64.whl)
          # delocate copies external dylibs into .dylibs/; the wheel must not need any.
          if unzip -Z1 "$wheel" | grep -F '.dylibs/'; then
            echo "::error::the macOS wheel bundles an external dynamic library" >&2
            exit 1
          fi
          python -m venv smoke
          smoke/bin/python -m pip install "$wheel"
          smoke/bin/python - <<'PY'
          import nirs4all_formats as nio
          from nirs4all_formats import _native  # the extension, not the CLI fallback

          records = nio.open_records("samples/matlab/prospectr_NIRsoil.RData")
          assert records and records[0]["signals"], "no signal decoded"
          print(f"nirs4all-formats {nio.__version__}: {len(records)} records via {_native.__name__}")
          PY

  r:
    name: R binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install R test system dependencies
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev
      - name: Install dependencies
        run: |
          Rscript -e 'install.packages(c("jsonlite", "testthat"))'
          Rscript -e 'stopifnot(requireNamespace("jsonlite", quietly = TRUE), requireNamespace("testthat", quietly = TRUE))'
      - name: Install and test both R packages
        run: |
          R CMD INSTALL --install-tests bindings/r/nirs4allformats
          Rscript -e 'Sys.setenv(NIRS4ALL_FORMATS_REPO=getwd()); testthat::test_package("nirs4allformats", stop_on_failure = TRUE)'
          R CMD INSTALL --install-tests bindings/r/nirs4allformatslite
          Rscript -e 'Sys.setenv(NIRS4ALL_FORMATS_REPO=getwd()); testthat::test_package("nirs4allformats.lite", stop_on_failure = TRUE)'

  # The Windows build links the Rust static library with the Rtools linker, so
  # it depends on the current stable Rust and Rtools, not only on this tree.
  # Run the same vendored, offline R CMD check as release-r.yml on every pull
  # request so a break is seen before a release tag.
  r-windows:
    name: R CMD check (Windows) / ${{ matrix.pkg }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - nirs4allformats
          - nirs4allformatslite
    env:
      _R_CHECK_CRAN_INCOMING_REMOTE_: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          working-directory: bindings/r/${{ matrix.pkg }}
          extra-packages: |
            any::rcmdcheck
            any::knitr
            any::rmarkdown
            any::testthat
      - name: Vendor the Rust core into the R package
        shell: bash
        run: cd bindings/r/${{ matrix.pkg }} && N4FMT_R_VENDOR=1 ./configure
      - name: R CMD check --as-cran
        uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        env:
          CARGO_NET_OFFLINE: "true"
          NIRS4ALL_FORMATS_REPO: ${{ github.workspace }}
        with:
          working-directory: bindings/r/${{ matrix.pkg }}
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'
      - name: Show the install log on failure
        if: failure()
        shell: bash
        run: tail -n 80 bindings/r/${{ matrix.pkg }}/check/*.Rcheck/00install.out

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Build docs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt
          sphinx-build -b html docs docs/_build/html

  # C ABI: build the shared library once, check the committed header matches the
  # cbindgen output and run the C smoke program (tests/c_smoke.rs). The Java,
  # .NET and Julia jobs test against this library.
  c-abi:
    name: C ABI
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Test the C ABI and the C smoke program
        run: cargo test -p nirs4all-formats-capi
      - name: Build the release library
        run: cargo build --release --locked -p nirs4all-formats-capi
      - name: Committed header matches cbindgen
        run: git diff --exit-code -- crates/nirs4all-formats-capi/include/nirs4all_formats.h
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: capi-linux-x86-64
          path: target/release/libnirs4all_formats_capi.so
          if-no-files-found: error

  java:
    name: Java binding
    needs: c-abi
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: capi-linux-x86-64
          path: native
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        working-directory: bindings/java
        env:
          NIRS4ALL_FORMATS_LIBRARY: ${{ github.workspace }}/native/libnirs4all_formats_capi.so
        run: mvn -B test

  csharp:
    name: C# binding
    needs: c-abi
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: capi-linux-x86-64
          path: native
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Test
        env:
          NIRS4ALL_FORMATS_LIBRARY: ${{ github.workspace }}/native/libnirs4all_formats_capi.so
        run: dotnet test bindings/csharp/tests/Nirs4all.Formats.Tests --nologo

  julia:
    name: Julia binding
    needs: c-abi
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: capi-linux-x86-64
          path: native
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.11"
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
      - name: Test
        env:
          NIRS4ALL_FORMATS_LIBRARY: ${{ github.workspace }}/native/libnirs4all_formats_capi.so
        run: julia --project=bindings/julia/NIRS4ALLFormats -e 'using Pkg; Pkg.instantiate(); Pkg.test()'

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (linux/amd64, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: nirs4all-formats:ci
      - name: Convert a sample as the image user
        run: |
          set -euo pipefail
          mkdir -p out && chmod 777 out
          docker run --rm -v "$PWD/samples/galactic_spc:/data/in:ro" -v "$PWD/out:/data/out" \
            nirs4all-formats:ci convert /data/in/nir.spc --to jcamp-dx --out /data/out
          ls -l out
          test -s out/nir_1.jdx
