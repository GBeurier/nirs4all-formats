name: CI

on:
  push:
    branches: [main, 'rc/**']
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  python:
    name: Python helper packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e tools/reverse-lab -e "bindings/python[numpy,pandas]" pytest
      - name: Test
        run: python -m pytest tools/reverse-lab/tests bindings/python/tests tests/release

  r:
    name: R binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install R test system dependencies
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev
      - name: Install dependencies
        run: |
          Rscript -e 'install.packages(c("jsonlite", "testthat"))'
          Rscript -e 'stopifnot(requireNamespace("jsonlite", quietly = TRUE), requireNamespace("testthat", quietly = TRUE))'
      - name: Install and test both R packages
        run: |
          R CMD INSTALL bindings/r/nirs4allformats
          Rscript -e 'Sys.setenv(NIRS4ALL_FORMATS_REPO=getwd()); testthat::test_package("nirs4allformats", stop_on_failure = TRUE)'
          R CMD INSTALL bindings/r/nirs4allformatslite
          Rscript -e 'Sys.setenv(NIRS4ALL_FORMATS_REPO=getwd()); testthat::test_package("nirs4allformats.lite", stop_on_failure = TRUE)'

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Build docs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt
          sphinx-build -b html docs docs/_build/html
