name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts without publishing"
        required: false
        default: "true"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  python-wheels:
    name: Python wheel (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS binary wheels are deferred for the initial release. The default
        # "formats-all" feature set links the system HDF5 (fmt-hdf5; fmt-matlab
        # requires it), whose transitive homebrew liblzma is built for macOS 15,
        # so delocate rejects the wheel against an 11.0 deployment target. A
        # portable macOS wheel needs a from-source static HDF5 build (tracked as
        # a follow-up). Until then macOS users install the sdist, which builds
        # against their own HDF5; Linux + Windows wheels ship the full feature
        # set. See docs/dev/release_process.md.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel
      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse bindings/python
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  python-sdist:
    name: Python sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install maturin
        run: python -m pip install maturin
      - name: Build sdist
        run: maturin sdist --manifest-path bindings/python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  c-abi-archive:
    name: C ABI archive (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: tar.gz }
          - { os: macos-latest, target: x86_64-apple-darwin, ext: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release artifacts
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} -p nirs4all-formats-capi
          STAGING="nirs4all-formats-capi-${{ matrix.target }}"
          mkdir -p "$STAGING/lib" "$STAGING/include"
          cp crates/nirs4all-formats-capi/include/nirs4all_formats.h "$STAGING/include/"
          cp LICENSE "$STAGING/"
          # Linux + macOS layouts
          for lib in target/${{ matrix.target }}/release/libnirs4all_formats_capi.*; do
            if [ -f "$lib" ]; then cp "$lib" "$STAGING/lib/"; fi
          done
          # Windows layout
          if [ -f "target/${{ matrix.target }}/release/nirs4all_formats_capi.dll" ]; then
            cp "target/${{ matrix.target }}/release/nirs4all_formats_capi.dll" "$STAGING/lib/"
            cp "target/${{ matrix.target }}/release/nirs4all_formats_capi.dll.lib" "$STAGING/lib/" || true
          fi
          if [ "${{ matrix.ext }}" = "zip" ]; then
            7z a "${STAGING}.zip" "$STAGING/"
          else
            tar czf "${STAGING}.tar.gz" "$STAGING/"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: c-abi-${{ matrix.target }}
          path: nirs4all-formats-capi-${{ matrix.target }}.*
          if-no-files-found: error

  # NOTE: the R source-tarball build lives in its own workflow now —
  # .github/workflows/release-r.yml. That job runs N4FMT_R_VENDOR=1 ./configure
  # to vendor the Rust core + cargo-vendored deps so the tarball installs OFFLINE
  # with no monorepo `crates/` (the naive `R CMD build bindings/r/nirs4allformats`
  # that used to live here produced a tarball with unresolved ../../../../../crates
  # path deps, which is uninstallable off-tree). release-r.yml also attaches the
  # CRAN tarball to the Release on non-rc tags, replacing this job's old artifact.

  publish-pypi:
    name: Publish to PyPI
    needs: [python-wheels, python-sdist]
    runs-on: ubuntu-latest
    # Gate to production tags only. Pre-release tags (anything containing '-',
    # e.g. v0.1.0-alpha.1) are excluded so they never reach PyPI — mirrors
    # nirs4all-methods' release-wheels.yml / release-python.yml convention.
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && github.event_name != 'workflow_dispatch' }}
    # Use the `pypi` GitHub environment so the OIDC token carries an
    # `environment: pypi` claim — matching the Trusted Publisher configured on
    # pypi.org with Environment = `pypi`. This is the SAME convention as
    # nirs4all-methods (release-wheels.yml / release-python.yml), so every
    # publisher across the ecosystem is created identically: owner=GBeurier,
    # repo=<this repo>, workflow=<this file>, Environment=`pypi`.
    environment:
      name: pypi
      url: https://pypi.org/p/nirs4all-formats
    permissions:
      id-token: write
    steps:
      # Pull ONLY the Python wheels + sdist into dist/. download-artifact with no
      # `name:`/`pattern:` grabs EVERY run artifact, which dragged the C-ABI
      # archives (nirs4all-formats-capi-*.tar.gz) into dist/; the publish action's
      # twine pre-flight then rejected them ("InvalidDistribution: No PKG-INFO in
      # archive") and aborted before any upload. Wheels live under wheels-*, the
      # sdist under the `sdist` artifact.
      - name: Download Python wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - name: Download Python sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Validate tag matches the built wheel/sdist version
        run: |
          set -euo pipefail
          # The tag minus the leading 'v' must equal the PEP 440 package
          # version baked into the wheels + sdist. PEP 440 alpha/beta/rc
          # spellings (0.1.0a1, 0.1.0b2, 0.1.0rc1) are allowed alongside a
          # plain X.Y.Z; SemVer pre-release tags (with '-') are already gated
          # out of this job above. scripts/bump_version.sh keeps the package
          # version in sync with the Cargo workspace SoT.
          tag_version="${GITHUB_REF_NAME#v}"
          # nirs4all-formats normalizes to nirs4all_formats-<version>-... for
          # wheels and nirs4all_formats-<version>.tar.gz for the sdist.
          dist_file=$(ls dist/nirs4all_formats-*.whl dist/nirs4all_formats-*.tar.gz 2>/dev/null | head -n1 || true)
          if [[ -z "${dist_file}" ]]; then
            echo "::error::no nirs4all_formats wheel/sdist found in dist/ to validate" >&2
            ls -la dist/ >&2 || true
            exit 1
          fi
          base=$(basename "${dist_file}")
          # Strip the package prefix, then take the version up to the first
          # '-' (wheels) or '.tar.gz' (sdist).
          rest="${base#nirs4all_formats-}"
          dist_version="${rest%%-*}"          # wheel:  0.1.0a1-cp310-...  -> 0.1.0a1
          dist_version="${dist_version%.tar.gz}"  # sdist: 0.1.0a1.tar.gz -> 0.1.0a1
          # Auto-publish to the real PyPI index is PRODUCTION-ONLY: the tag must
          # be a plain vX.Y.Z. This is stricter than the job-level
          # !contains('-') gate (which lets a PEP 440 prerelease spelling like
          # v0.1.0a1 slip through, since it has no '-'); pre-releases are
          # published via workflow_dispatch -> TestPyPI, never auto on a tag.
          if [[ ! "${tag_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not a production release version (vX.Y.Z); pre-releases are not auto-published to PyPI" >&2
            exit 1
          fi
          if [[ "${tag_version}" != "${dist_version}" ]]; then
            echo "::error::Tag version (${tag_version}) != built package version (${dist_version})" >&2
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches built package version ${dist_version}."
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  github-release:
    name: Attach release artifacts
    needs: [python-wheels, python-sdist, c-abi-archive]
    runs-on: ubuntu-latest
    # Same gate as publish-pypi: production tags only, pre-release tags ('-')
    # excluded so a pre-release never cuts a public GitHub Release.
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && github.event_name != 'workflow_dispatch' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
