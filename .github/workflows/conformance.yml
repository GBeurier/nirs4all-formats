name: Conformance

on:
  schedule:
    - cron: "19 3 * * 1"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  reference-readers:
    name: Reference-reader conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          # Serve precompiled Linux binaries from Posit Package Manager so the
          # spectrolab dependency chain (shiny -> fs/sass/bslib) installs cleanly
          # instead of failing to build from source.
          use-public-rspm: true

      - name: Install Python reference readers
        run: |
          python -m pip install --upgrade pip
          # spc-spectra's setup.py imports the package (and numpy) at build time
          # and ships no build-system requirements, so it is installed with
          # --no-build-isolation against pre-seeded build deps.
          python -m pip install setuptools wheel numpy
          python -m pip install --no-build-isolation spc-spectra
          python -m pip install -r tests/conformance/requirements.txt

      - name: Install R spectrolab reference reader
        # Skip-tolerant: install.packages only warns on failure, so a flaky
        # install lets the SED/SIG tests skip rather than failing the job. Errors
        # stay visible (no quiet=TRUE); repos comes from use-public-rspm above.
        run: |
          Rscript -e 'install.packages(c("spectrolab", "jsonlite"))'

      - name: Build nirs4all-formats Python binding
        run: |
          # `maturin develop` needs an active virtualenv; setup-python is a bare
          # interpreter, so build+install the PyO3 binding via pip's PEP 517
          # maturin backend (build isolation pulls maturin) into the same env as
          # the reference readers above. Mirrors ci.yml.
          python -m pip install -e "bindings/python[numpy]"

      - name: Run conformance suite
        run: |
          # tests/conformance/conftest.py turns an all-skipped run into a hard
          # failure, so a missing binding/reference environment cannot go green.
          python -m pytest -m conformance tests/conformance/ -ra
