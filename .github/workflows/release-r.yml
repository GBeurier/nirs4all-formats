# Build, check, and (eventually) submit the nirs4allformats R packages
# (the complete `nirs4allformats` and the smaller `nirs4allformats.lite`, dir
# bindings/r/nirs4allformatslite).
#
# Triggers
# --------
# - workflow_dispatch        -> on-demand R CMD check + tarball build.
# - push tag v[0-9]*.[0-9]*.[0-9]* -> check -> build-tarball -> attach the CRAN
#   tarball to the matching GitHub Release (publish-release-asset, gated on a
#   non-rc tag).
#
# The package builds standalone via the vendored configure mode
# (N4FMT_R_VENDOR=1, set per-step below): ./configure copies the workspace core
# crates into src/rust/vendored/, emits a self-contained src/rust/Cargo.toml,
# `cargo vendor`s every crates.io transitive dep into src/rust/vendor.tar.xz, and
# writes a source-replacement .cargo/config.toml so the R install builds OFFLINE
# (no external crates/, no network). Verified locally: standalone offline install
# of the built tarball from a directory with no monorepo `crates/` and
# CARGO_NET_OFFLINE=true succeeds; nirs4allformats_native_available() == TRUE.
#
# CRAN submission itself is the irreducible manual web-form step at
# https://cran.r-project.org/submit.html — this workflow produces + validates the
# self-contained tarball; the maintainer downloads it from the Release and
# submits. R-universe builds straight from Git via the .prepare hook (which runs
# the same N4FMT_R_VENDOR=1 ./configure before R CMD build).

name: release-r

on:
  workflow_dispatch: {}
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # =========================================================================
  # R CMD check --as-cran across the same matrix CRAN itself uses.
  # =========================================================================
  check:
    name: R CMD check / ${{ matrix.pkg }} / ${{ matrix.cfg.label }}
    runs-on: ${{ matrix.cfg.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - nirs4allformats
          - nirs4allformatslite
        cfg:
          - label: linux-release
            runs_on: ubuntu-22.04
            r_version: "release"
          - label: linux-devel
            runs_on: ubuntu-22.04
            r_version: "devel"
          - label: macos-arm64-release
            runs_on: macos-14
            r_version: "release"
          - label: windows-release
            runs_on: windows-2022
            r_version: "release"
    env:
      R_KEEP_PKG_SOURCE: yes
      # NB: N4FMT_R_VENDOR is intentionally NOT a job-wide env. It must be set
      # ONLY for the pre-vendor step below (which runs in the checkout, where
      # crates/ exists). Setting it job-wide would make ./configure re-vendor
      # during the tarball INSTALL too — but the unpacked tarball has no
      # crates/, so it would fail. The bundled src/rust/vendored/ +
      # vendor.tar.xz are used at check time instead (the real CRAN scenario).
      #
      # The build is offline; disable the incoming-feasibility URL check.
      _R_CHECK_CRAN_INCOMING_REMOTE_: false
      # NB: CARGO_NET_OFFLINE is NOT job-wide — the "Vendor" step below runs
      # `cargo vendor`, which MUST reach crates.io. It is set only on the
      # R CMD check step (the offline INSTALL); the Makevars also passes
      # `cargo build --offline`, so the install build is offline regardless.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: ${{ matrix.cfg.r_version }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          working-directory: bindings/r/${{ matrix.pkg }}
          extra-packages: |
            any::rcmdcheck
            any::knitr
            any::rmarkdown
            any::testthat

      # Populate src/rust/vendored/ + src/rust/vendor.tar.xz from the in-repo
      # crates/ (gitignored, absent at checkout). N4FMT_R_VENDOR=1 is scoped to
      # THIS step, where crates/ is reachable; the build then bundles the
      # vendored tree into the tarball and the check installs from that bundled
      # copy (no re-vendor at install time). shell: bash so it runs on the
      # Windows runner (Rtools provides bash + tar/xz; the package ships
      # src/Makevars.win for the actual Windows compile).
      - name: Vendor the Rust core into the R package
        shell: bash
        run: cd bindings/r/${{ matrix.pkg }} && N4FMT_R_VENDOR=1 ./configure

      - name: R CMD check --as-cran
        uses: r-lib/actions/check-r-package@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        env:
          CARGO_NET_OFFLINE: "true"   # the INSTALL build is offline from the bundle
          # Point the integration tests at the checked-out samples/ tree so they
          # run on CI; off-tree (CRAN) the var is unset and those tests skip.
          NIRS4ALL_FORMATS_REPO: ${{ github.workspace }}
        with:
          working-directory: bindings/r/${{ matrix.pkg }}
          # r-lib/actions/check-r-package interpolates these into
          # rcmdcheck::rcmdcheck(args = ..., error_on = ...) as literal R code,
          # so they must be valid R syntax.
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'
          upload-snapshots: true

      - name: Upload check artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rcheck-${{ matrix.pkg }}-${{ matrix.cfg.label }}
          path: bindings/r/${{ matrix.pkg }}.Rcheck/

  # =========================================================================
  # Build the source tarball that the maintainer uploads to CRAN.
  # =========================================================================
  build-tarball:
    name: Build source tarball (${{ matrix.pkg }})
    needs: check
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - nirs4allformats
          - nirs4allformatslite
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          working-directory: bindings/r/${{ matrix.pkg }}
          extra-packages: any::knitr any::rmarkdown

      - name: Vendor the Rust core into src/rust (self-contained tarball)
        working-directory: bindings/r/${{ matrix.pkg }}
        env:
          N4FMT_R_VENDOR: "1"
        # ./configure copies the workspace core crates + cargo-vendors every
        # crates.io dep into src/rust/, so the source tarball is self-contained
        # (no external crates/; CRAN's farm compiles offline from the bundle).
        run: ./configure

      # The built tarball is named after the DESCRIPTION Package field, which may
      # differ from the directory: nirs4allformatslite/ produces
      # nirs4allformats.lite_<ver>.tar.gz. Match the actual *.tar.gz, not the dir.
      - name: R CMD build (produces <Package>_${VER}.tar.gz)
        working-directory: bindings/r/${{ matrix.pkg }}
        run: R CMD build .

      - name: Stage tarball
        working-directory: bindings/r/${{ matrix.pkg }}
        run: |
          set -euo pipefail
          mkdir -p ../../../dist-r
          mv *_*.tar.gz ../../../dist-r/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.pkg }}-cran-tarball
          path: dist-r/*_*.tar.gz
          if-no-files-found: error
          retention-days: 90

  # =========================================================================
  # Attach the tarball to the GitHub Release on tag pushes (vX.Y.Z).
  # The maintainer then downloads from the Release and submits via the CRAN
  # web form at https://cran.r-project.org/submit.html.
  # =========================================================================
  publish-release-asset:
    name: Attach tarball to GitHub Release
    needs: build-tarball
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-cran-tarball'
          merge-multiple: true
          path: dist-r/

      - name: Upload to the matching Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: dist-r/*.tar.gz
          fail_on_unmatched_files: true
