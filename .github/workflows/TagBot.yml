# Tag Julia package releases after JuliaRegistrator registers a version of
# bindings/julia/NIRS4ALLFormats in the General registry. TagBot creates the
# tag NIRS4ALLFormats-v<version> and its GitHub release; the v<version> tags
# of the other channels are unaffected. See docs/bindings/julia.md.
name: TagBot

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      lookback:
        description: 'Days to look back for registrations'
        default: "3"

permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read

jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@a761b867f05e7e410011ab16b244f2fffec16c85 # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          subdir: bindings/julia/NIRS4ALLFormats
