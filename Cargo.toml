[workspace]
resolver = "2"
members = [
    "crates/nirs4all-formats-core",
    "crates/nirs4all-formats",
    "crates/nirs4all-formats-capi",
    "crates/nirs4all-formats-cli",
]
exclude = [
    "bindings/python",
    "bindings/wasm",
    "bindings/r/nirs4allformats/src/rust",
    "bindings/r/nirs4allformatsfull/src/rust",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Gregory Beurier <gregory.beurier@cirad.fr>"]
repository = "https://github.com/GBeurier/nirs4all-formats"
homepage = "https://github.com/GBeurier/nirs4all-formats"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
# `version` is REQUIRED alongside `path` for crates.io publishing (a path-only
# intra-workspace dep makes `cargo publish` fail: "all dependencies must have a
# version requirement"). Kept in sync with [workspace.package] version by
# scripts/bump_version.sh.
nirs4all-formats-core = { path = "crates/nirs4all-formats-core", version = "0.1.0" }
nirs4all-formats = { path = "crates/nirs4all-formats", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
