[package]
name = "nirs4all-formats"
description = "Rust-first NIRS and spectroscopy file loading facade."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["formats-all"]
# Convenience meta-feature enabling every reader.
formats-all = ["fmt-hdf5", "fmt-matlab", "fmt-parquet"]
# HDF5/NetCDF-backed readers (Hdf5, NetCDF, Allotrope ADF, FGI XML+HDF5).
# Required by `fmt-matlab` because MATLAB v7.3 files are HDF5 containers.
# `chrono` powers the ARM MFRSR `time:units` epoch parsing.
fmt-hdf5 = ["dep:hdf5-reader", "dep:netcdf-reader", "dep:chrono"]
# MATLAB MAT v5 + v7.3 and prospectr RData (xz-encoded R workspaces).
# Pure-Rust deps only (lzma-rs, not the C liblzma `xz2`) so it cross-compiles
# to wasm32 — every reader is available in the browser build.
fmt-matlab = ["dep:matfile", "dep:lzma-rs", "dep:rds2rust", "fmt-hdf5"]
# Apache Parquet tables produced by NIRS pipelines.
fmt-parquet = ["dep:parquet", "dep:arrow-array", "dep:arrow-schema", "dep:bytes"]

[dependencies]
nirs4all-formats-core.workspace = true
arrow-array = { version = "58.3.0", optional = true }
arrow-schema = { version = "58.3.0", optional = true }
bytes = { version = "1", optional = true }
calamine = "0.35.0"
chrono = { version = "0.4", default-features = false, optional = true, features = ["alloc"] }
cfb = "0.14.0"
flate2 = "1.1.5"
hdf5-reader = { version = "0.5.0", optional = true }
matfile = { version = "0.5.0", optional = true }
netcdf-reader = { version = "0.5.0", optional = true }
# Pure-Rust compression only (snappy, not the C `zstd`) so Parquet
# cross-compiles to wasm32. zstd-compressed Parquet is the only variant lost.
parquet = { version = "58.3.0", optional = true, default-features = false, features = ["arrow", "snap"] }
quick-xml = "0.40.1"
rds2rust = { version = "0.1.41", optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
lzma-rs = { version = "0.3.0", optional = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# Native builds additionally get the C `zstd` Parquet codec (Cargo unions the
# features), so zstd-compressed Parquet still decodes off-wasm. The wasm32 build
# stays pure-Rust (snappy/uncompressed/plain only).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
parquet = { version = "58.3.0", optional = true, default-features = false, features = ["zstd"] }

[dev-dependencies]
tempfile = "3"
