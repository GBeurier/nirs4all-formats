[package]
name = "nirs4all-formats-capi"
description = "C ABI surface for the Rust nirs4all-formats core."
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
base64 = "0.23"
nirs4all-formats.workspace = true
serde.workspace = true
# Records cross this ABI as JSON text: parse their floats with correct
# rounding so exported values equal the decoded ones bit for bit.
serde_json = { workspace = true, features = ["float_roundtrip"] }

[build-dependencies]
cbindgen = "0.29"
