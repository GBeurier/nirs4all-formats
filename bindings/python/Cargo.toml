[package]
name = "nirs4all-formats-python"
description = "Native PyO3 bindings for nirs4all-formats."
version = "0.2.13"
edition = "2021"
rust-version = "1.88"
license = "CECILL-2.1 OR AGPL-3.0-or-later"
authors = ["Gregory Beurier <gregory.beurier@cirad.fr>"]
repository = "https://github.com/GBeurier/nirs4all-formats"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
nirs4all-formats = { path = "../../crates/nirs4all-formats" }
nirs4all-formats-core = { path = "../../crates/nirs4all-formats-core" }
# pythonize 0.29 is the latest compatible bridge; 0.30 is not published yet.
pyo3 = { version = "=0.29.3", features = ["extension-module", "abi3-py310"] }
pythonize = "0.29"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
