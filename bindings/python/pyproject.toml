[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "nirs4all-formats"
version = "0.2.9"
description = "Python bindings for the Rust-first nirs4all-formats NIRS loader."
readme = "README.md"
requires-python = ">=3.10"
license = "CeCILL-2.1 OR AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [{ name = "Gregory Beurier", email = "gregory.beurier@cirad.fr" }]
dependencies = ["numpy>=1.24,<2.5"]

[project.optional-dependencies]
numpy = ["numpy>=1.24,<2.5"]
pandas = ["pandas>=2.0"]
sklearn = ["scikit-learn>=1.3"]
torch = ["torch>=2.1"]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.10", "maturin>=1.7"]

[tool.maturin]
python-source = "python"
module-name = "nirs4all_formats._native"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true

# ---------------------------------------------------------------------------
# cibuildwheel configuration for the Phase 6 release pipeline (M4).
#
# The release workflow currently runs cibuildwheel on Linux x86_64 and Windows
# AMD64. macOS uses the sdist until its HDF5 closure is portable, and Linux
# aarch64 has no native runner/emulation lane yet. The per-platform settings
# below document the intended configuration if either lane is enabled later.
# ---------------------------------------------------------------------------

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
# Skip 32-bit Windows and musllinux for the initial release; the audience
# is server-side / data-science where manylinux + glibc is the norm.
skip = "*-win32 *-musllinux* pp*"
test-command = "python -m pytest {project}/bindings/python/tests"
# pytest must be installed into cibuildwheel's isolated test venv. NumPy is a
# base runtime dependency because importing the public record model requires it;
# no optional extra is used by this smoke, so it qualifies the default install.
test-requires = ["pytest"]
before-all = "pip install maturin"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"
before-all = "yum install -y openssl-devel || apt-get install -y libssl-dev || true"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
# The macOS runner builds BOTH archs, so the cross target must be installed
# (else `cargo` fails with E0463 "can't find crate for core"). A platform
# before-all overrides the top-level one, so re-include the maturin install.
before-all = "rustup target add x86_64-apple-darwin aarch64-apple-darwin && pip install maturin"
# The Rust toolchain links a macOS floor above the default 10.9 wheel tag, so
# delocate rejects the wheel ("dependencies do not satisfy target 10.9"). Pin
# the deployment target (11.0, as nirs4all-methods does) so the wheel tag, the
# compiled minimum, and delocate's check all agree.
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]
