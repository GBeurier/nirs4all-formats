[package]
name = "nirs4all-formats-wasm"
description = "WebAssembly bindings for nirs4all-formats."
version = "0.1.0-alpha.0"
edition = "2021"
license = "MIT"
authors = ["G. Beurier <beurier@cirad.fr>"]
repository = "https://github.com/GBeurier/nirs4all-formats"
publish = false

[lib]
name = "nirs4all_formats_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
nirs4all-formats = { path = "../../crates/nirs4all-formats", default-features = false }
nirs4all-formats-core = { path = "../../crates/nirs4all-formats-core" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = { version = "0.1", optional = true }

# Pull the upstream wasm32 linkability fix (merge commit of PR #46)
# until it is published as hdf5-reader 0.5.1. Remove this patch and
# bump the `hdf5-reader` requirement once 0.5.1 lands on crates.io.
[patch.crates-io]
hdf5-reader = { git = "https://github.com/roteiro-gis/netcdf-rust", rev = "f0cdd2f0dbd2c6a036fc18cc4ae58d4072d7cb0b" }

[features]
# Every reader family is available in the WASM build now that the core uses
# browser-compatible compression (lzma-rs for RData, snappy/zstd for Parquet).
# HDF5 relies on the upstream `read_exact_at` wasm fix in `[patch.crates-io]`
# above; `fmt-matlab` needs `fmt-hdf5` (MAT v7.3 is an HDF5 container).
default = ["fmt-hdf5", "fmt-matlab", "fmt-parquet"]
fmt-hdf5 = ["nirs4all-formats/fmt-hdf5"]
fmt-matlab = ["nirs4all-formats/fmt-matlab"]
fmt-parquet = ["nirs4all-formats/fmt-parquet"]
console-errors = ["dep:console_error_panic_hook"]

[profile.release]
opt-level = "s"
lto = "thin"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os"]
