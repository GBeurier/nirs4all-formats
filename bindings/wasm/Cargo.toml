[package]
name = "nirs4all-formats-wasm"
description = "WebAssembly bindings for nirs4all-formats."
version = "0.2.13"
edition = "2021"
rust-version = "1.88"
# Prefer dependencies compatible with the declared MSRV on fresh builds.
resolver = "3"
license = "CECILL-2.1 OR AGPL-3.0-or-later"
authors = ["Gregory Beurier <gregory.beurier@cirad.fr>"]
repository = "https://github.com/GBeurier/nirs4all-formats"
publish = false

[lib]
name = "nirs4all_formats_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
nirs4all-formats = { path = "../../crates/nirs4all-formats", default-features = false }
nirs4all-formats-core = { path = "../../crates/nirs4all-formats-core" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = { version = "0.1", optional = true }

[features]
# Every reader family is available in the WASM build now that the core uses
# browser-compatible compression (lzma-rs for RData, snappy/zstd for Parquet).
# HDF5 0.9.3 already includes the upstream wasm read_exact_at fix. The facade
# uses the licensed local lru security backport; no obsolete Git patch is needed.
# `fmt-matlab` needs `fmt-hdf5` (MAT v7.3 is an HDF5 container).
default = ["fmt-hdf5", "fmt-matlab", "fmt-parquet"]
fmt-hdf5 = ["nirs4all-formats/fmt-hdf5"]
fmt-matlab = ["nirs4all-formats/fmt-matlab"]
fmt-parquet = ["nirs4all-formats/fmt-parquet"]
console-errors = ["dep:console_error_panic_hook"]

[profile.release]
opt-level = "s"
lto = "thin"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os"]
