# GENERATED by ./configure (N4FMT_R_VENDOR=1) — self-contained vendored workspace.
#
# This manifest is BOTH the workspace root AND the extendr staticlib package.
# The two core crates under vendored/ are workspace members; they inherit
# version/deps from [workspace.package] / [workspace.dependencies] below, which
# mirror the monorepo root Cargo.toml (the source tarball has no monorepo).
[workspace]
resolver = "2"
members = [
    "vendored/nirs4all-formats-core",
    "vendored/nirs4all-formats",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
license = "MIT"
authors = ["G. Beurier <beurier@cirad.fr>"]
repository = "https://github.com/GBeurier/nirs4all-formats"
homepage = "https://github.com/GBeurier/nirs4all-formats"
readme = "README.md"

[workspace.dependencies]
nirs4all-formats-core = { path = "vendored/nirs4all-formats-core" }
nirs4all-formats = { path = "vendored/nirs4all-formats" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[package]
name = "nirs4allformats-r"
version = "0.1.0-alpha.1"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]
name = "nirs4allformats_r"

[dependencies]
extendr-api = { version = "0.7", default-features = false }
# LITE / CRAN build: core readers only. `default-features = false` drops the
# heavy `formats-all` readers (fmt-hdf5 [hdf5-reader + netcdf-reader], fmt-matlab
# [matfile + lzma-rs], fmt-parquet [arrow + parquet + zstd]) and their large
# crates.io closure, keeping the vendored source tarball under CRAN's 5 MB hard
# limit. The ~50 pure-Rust core readers (JCAMP-DX, SPC, OPUS, ASD, ENVI, CSV,
# Excel, ...) stay. Feeding an excluded format (HDF5/netCDF, Parquet, MATLAB) to
# this build returns an actionable error pointing at the full R-universe package
# (the facade's graceful-degradation stub readers). The full-reader sibling
# package `nirs4allformatsfull` keeps the default features.
nirs4all-formats = { path = "vendored/nirs4all-formats", default-features = false }
nirs4all-formats-core = { path = "vendored/nirs4all-formats-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 2
lto = "thin"
