[package]
name = "nirs4allformats-r"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]
name = "nirs4allformats_r"

[dependencies]
extendr-api = { version = "0.7", default-features = false }
# LITE / CRAN build: core readers only (default features off drops the heavy
# fmt-hdf5/fmt-matlab/fmt-parquet readers to stay under CRAN's 5 MB tarball
# limit). ./configure regenerates this section verbatim for the vendored
# tarball; keep the two in sync. The full-reader build lives in the sibling
# package nirs4allformatsfull.
nirs4all-formats = { path = "../../../../../crates/nirs4all-formats", default-features = false }
nirs4all-formats-core = { path = "../../../../../crates/nirs4all-formats-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 2
lto = "thin"
