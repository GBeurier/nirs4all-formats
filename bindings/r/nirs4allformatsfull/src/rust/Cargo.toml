[package]
name = "nirs4allformats-r"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]
name = "nirs4allformats_r"

[dependencies]
extendr-api = { version = "0.7", default-features = false }
# FULL build: every reader. The facade's default features (`formats-all`) pull
# in the heavy fmt-hdf5/fmt-matlab/fmt-parquet readers (Arrow/Parquet,
# HDF5/netCDF, MATLAB + xz codecs). The resulting vendored closure (~14 MB)
# exceeds CRAN's 5 MB tarball limit, so this package ships through R-universe
# only — never CRAN. The size-trimmed CRAN sibling is `nirs4allformats`
# (`default-features = false`). ./configure regenerates this section verbatim
# for the vendored tarball WITHOUT trimming optional readers; keep in sync.
nirs4all-formats = { path = "../../../../../crates/nirs4all-formats" }
nirs4all-formats-core = { path = "../../../../../crates/nirs4all-formats-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 2
lto = "thin"
